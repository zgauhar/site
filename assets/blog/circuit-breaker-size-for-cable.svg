<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1100" cy="70" r="190" fill="#fff" opacity=".3"/><circle cx="80" cy="590" r="150" fill="#fff" opacity=".3"/>
<g font-family="Space Grotesk,Arial,sans-serif" font-weight="700">
<rect x="90" y="150" width="280" height="330" rx="30" fill="#fff"/><text x="230" y="240" font-size="34" fill="#55604f" text-anchor="middle" font-family="DM Sans,Arial,sans-serif">Load Ib</text><text x="230" y="360" font-size="96" fill="#174a45" text-anchor="middle">20 A</text>
