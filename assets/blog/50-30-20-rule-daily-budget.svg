<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A 50 30 20 pie chart with the wants slice divided into a daily amount">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f2ef"/><stop offset="1" stop-color="#a9d3cb"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1100" cy="560" r="200" fill="#fff" opacity=".35"/>
<g font-family="Space Grotesk,Arial,sans-serif" font-weight="700" text-anchor="middle">
<g transform="translate(340 315)">
<circle r="220" fill="#174a45"/>
<path d="M0 0 L0 -220 A220 220 0 0 1 0 220 Z" fill="#174a45"/>
<path d="M0 0 L0 220 A220 220 0 0 1 -208.8 69 Z" fill="#f2b33d"/>
<path d="M0 0 L-208.8 69 A220 220 0 0 1 0 -220 Z" fill="#e0703a"/>
<text x="90" y="10" font-size="58" fill="#fff">50%</text>
<text x="-70" y="150" font-size="44" fill="#172018">20%</text>
<text x="-120" y="-50" font-size="52" fill="#fff">30%</text>
</g>
<g transform="translate(700 150)">
<rect width="400" height="90" rx="22" fill="#174a45"/><text x="200" y="60" font-size="34" fill="#fff">Needs 50%</text>
<rect y="115" width="400" height="90" rx="22" fill="#e0703a"/><text x="200" y="175" font-size="34" fill="#fff">Wants 30%</text>
<rect y="230" width="400" height="90" rx="22" fill="#f2b33d"/><text x="200" y="290" font-size="34" fill="#172018">Savings 20%</text>
<path d="M200 330 v34" stroke="#174a45" stroke-width="8"/><path d="M184 352 l16 18 16 -18" fill="none" stroke="#174a45" stroke-width="8"/>
<rect y="385" width="400" height="90" rx="45" fill="#fff"/><text x="200" y="446" font-size="40" fill="#236a63">24 / day</text>
</g></g></svg>
