<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Progesterone curve rising from baseline through the LH surge to ovulation with the fertile window shaded">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f4ef"/><stop offset="1" stop-color="#a9d6c9"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1100" cy="70" r="190" fill="#fff" opacity=".3"/><circle cx="80" cy="590" r="150" fill="#fff" opacity=".3"/>
<rect x="120" y="90" width="960" height="450" rx="30" fill="#fff"/>
<rect x="760" y="120" width="280" height="360" rx="16" fill="#f2b33d" opacity=".35"/>
<path d="M170 440 L170 150 M170 440 L1040 440" stroke="#55604f" stroke-width="4" fill="none"/>
<path d="M170 420 C400 418 520 410 600 360 C680 300 720 230 800 190 C880 160 960 150 1030 148" stroke="#174a45" stroke-width="10" fill="none" stroke-linecap="round"/>
<circle cx="600" cy="360" r="14" fill="#b04a1c"/><circle cx="760" cy="226" r="14" fill="#174a45"/>
<g font-family="DM Sans,Arial,sans-serif" font-weight="600" font-size="28" fill="#172018"><text x="400" y="470" text-anchor="middle">Baseline</text><text x="600" y="336" text-anchor="middle" fill="#b04a1c">LH surge</text><text x="660" y="190" text-anchor="middle">Ovulation</text><text x="900" y="520" text-anchor="middle" fill="#8a5a00">Fertile window</text></g>
<text x="150" y="130" font-family="Space Grotesk,Arial,sans-serif" font-weight="700" font-size="34" fill="#174a45">Progesterone ng/mL</text>
</svg>