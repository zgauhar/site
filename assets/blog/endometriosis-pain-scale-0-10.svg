<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A 0 to 10 pain scale with mild, moderate and severe bands">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d9d4"/><stop offset="1" stop-color="#eaa99f"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1080" cy="80" r="190" fill="#fff" opacity=".18"/><circle cx="90" cy="600" r="150" fill="#fff" opacity=".18"/>
<rect x="100" y="110" width="1000" height="410" rx="30" fill="#fff"/>
<text x="150" y="175" font-family="Space Grotesk,Arial,sans-serif" font-weight="700" font-size="36" fill="#9b3d52">Pain score, 0 to 10</text>
<g>
<rect x="150" y="230" width="270" height="70" rx="14" fill="#e9f0e6"/>
<rect x="420" y="230" width="330" height="70" fill="#f6d28b"/>
<rect x="750" y="230" width="300" height="70" rx="14" fill="#e9857d"/>
</g>
<g font-family="Space Grotesk,Arial,sans-serif" font-weight="700" font-size="34" fill="#172018" text-anchor="middle">
<text x="150" y="350">0</text><text x="285" y="350">1-3</text><text x="585" y="350">4-6</text><text x="900" y="350">7-10</text>
</g>
<g font-family="DM Sans,Arial,sans-serif" font-weight="600" font-size="26" fill="#55604f" text-anchor="middle">
<text x="285" y="410">Mild</text><text x="585" y="410">Interferes</text><text x="900" y="410">Stops the day</text>
</g>
<circle cx="640" cy="265" r="22" fill="#9b3d52"/>
<text x="150" y="480" font-family="DM Sans,Arial,sans-serif" font-size="26" fill="#9b8a8c">Anchor each number to what you can still do</text>
</svg>
