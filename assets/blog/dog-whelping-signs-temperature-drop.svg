<rect x="100" y="70" width="1000" height="320" rx="26" fill="#fff"/>
<line x1="150" y1="200" x2="1050" y2="200" stroke="#b04a1c" stroke-width="3" stroke-dasharray="12 10"/>
<text x="1050" y="188" font-size="22" fill="#b04a1c" text-anchor="end" font-family="DM Sans,Arial,sans-serif">37.8 &#176;C (100 &#176;F)</text>
<polyline points="150,140 270,130 390,145 510,135 630,142 750,138 870,262 990,330" fill="none" stroke="#236a63" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
