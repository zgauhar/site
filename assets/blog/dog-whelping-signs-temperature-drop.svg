<text x="150" y="100" font-size="24" fill="#55604f" font-family="DM Sans,Arial,sans-serif">Normal 38.0&#8211;39.2 &#176;C</text>
<text x="940" y="370" font-size="24" fill="#172018" text-anchor="middle" font-family="DM Sans,Arial,sans-serif">Whelping in 8&#8211;24 h</text>
