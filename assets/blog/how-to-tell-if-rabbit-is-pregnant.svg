<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A rabbit gestation timeline from day 0 to day 31 with the palpation window at day 10 to 14 and the nest box at day 28">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf3e2"/><stop offset="1" stop-color="#f0d9a8"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1100" cy="560" r="200" fill="#fff" opacity=".35"/>
<g font-family="Space Grotesk,Arial,sans-serif" font-weight="700" text-anchor="middle">
<text x="600" y="96" font-size="46" fill="#6e2419">Is she pregnant? Palpate on day 10–14</text>
<rect x="100" y="330" width="1000" height="24" rx="12" fill="#6e2419"/>
<rect x="100" y="330" width="420" height="24" rx="12" fill="#9e3b2c"/>
<circle cx="100" cy="342" r="26" fill="#6e2419"/><text x="100" y="420" font-size="28" fill="#6e2419">Bred</text>
<circle cx="1100" cy="342" r="26" fill="#e8c468" stroke="#6e2419" stroke-width="6"/><text x="1100" y="420" font-size="28" fill="#6e2419">Day 31</text>
<rect x="423" y="318" width="129" height="48" rx="24" fill="#e8c468" stroke="#6e2419" stroke-width="6"/>
<rect x="368" y="160" width="240" height="120" rx="22" fill="#fff"/>
<g fill="#9e3b2c"><circle cx="420" cy="230" r="16"/><circle cx="462" cy="230" r="16"/><circle cx="504" cy="230" r="16"/><circle cx="546" cy="230" r="16"/></g>
<text x="488" y="200" font-size="24" fill="#6e2419">kits = marbles</text>
<path d="M488 280 V316" stroke="#6e2419" stroke-width="6"/>
<text x="488" y="420" font-size="28" fill="#6e2419">Day 10–14</text>
<g><circle cx="968" cy="342" r="18" fill="#fff" stroke="#6e2419" stroke-width="6"/><rect x="858" y="450" width="220" height="64" rx="20" fill="#fff"/><text x="968" y="492" font-size="26" fill="#6e2419">Nest box in</text><path d="M968 362 V450" stroke="#6e2419" stroke-width="5"/><text x="968" y="300" font-size="26" fill="#6e2419">Day 28</text></g>
<g transform="translate(180 470)"><ellipse cx="60" cy="80" rx="70" ry="48" fill="#fff" stroke="#6e2419" stroke-width="6"/><ellipse cx="128" cy="44" rx="34" ry="30" fill="#fff" stroke="#6e2419" stroke-width="6"/><ellipse cx="122" cy="-4" rx="11" ry="34" fill="#fff" stroke="#6e2419" stroke-width="6"/><ellipse cx="146" cy="0" rx="11" ry="34" fill="#fff" stroke="#6e2419" stroke-width="6"/><circle cx="138" cy="40" r="5" fill="#6e2419"/></g>
</g></svg>
