<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Pomodoro cycle of four focus blocks with short breaks and a long break">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf1d8"/><stop offset="1" stop-color="#f6cf84"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1100" cy="560" r="200" fill="#fff" opacity=".35"/>
<g font-family="Space Grotesk,Arial,sans-serif" font-weight="700" text-anchor="middle">
<g transform="translate(60 110)"><rect width="1080" height="410" rx="32" fill="#fff"/>
<circle cx="200" cy="205" r="120" fill="none" stroke="#eef1ea" stroke-width="30"/><circle cx="200" cy="205" r="120" fill="none" stroke="#e0703a" stroke-width="30" stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="190" transform="rotate(-90 200 205)"/>
<text x="200" y="222" font-size="52" fill="#172018">25:00</text><text x="200" y="360" font-size="28" fill="#172018">Focus</text>
<g fill="#236a63"><rect x="380" y="150" width="130" height="110" rx="20"/><rect x="540" y="150" width="130" height="110" rx="20" opacity=".35"/><rect x="700" y="150" width="130" height="110" rx="20"/><rect x="860" y="150" width="170" height="110" rx="20" fill="#f2b33d"/></g>
<g fill="#fff" font-size="30"><text x="445" y="215">25</text><text x="765" y="215">25</text></g>
<g fill="#172018" font-size="30"><text x="605" y="215">5</text><text x="945" y="215">15</text></g>
<text x="720" y="340" font-size="26" fill="#55604f" font-family="DM Sans,Arial,sans-serif" font-weight="500">Focus, short break, focus, long break</text></g>
</g></svg>
