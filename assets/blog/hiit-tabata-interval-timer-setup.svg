<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Interval timer showing alternating 20 second work and 10 second rest steps for 8 Tabata rounds">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf1d8"/><stop offset="1" stop-color="#f6cf84"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1100" cy="570" r="200" fill="#fff" opacity=".35"/>
<g font-family="Space Grotesk,Arial,sans-serif" font-weight="700">
<rect x="70" y="70" width="520" height="490" rx="36" fill="#174a45"/>
<circle cx="330" cy="260" r="128" fill="none" stroke="#236a63" stroke-width="30"/>
<circle cx="330" cy="260" r="128" fill="none" stroke="#f2b33d" stroke-width="30" stroke-linecap="round" stroke-dasharray="804" stroke-dashoffset="260" transform="rotate(-90 330 260)"/>
<text x="330" y="262" text-anchor="middle" font-size="76" fill="#fff">00:13</text>
<text x="330" y="305" text-anchor="middle" font-size="28" fill="#f2b33d">WORK</text>
<text x="330" y="470" text-anchor="middle" font-size="46" fill="#fff">Round 5 of 8</text>
<text x="330" y="520" text-anchor="middle" font-size="26" fill="#cfe3df" font-family="DM Sans,Arial,sans-serif" font-weight="500">Tabata 20 / 10</text>
<g transform="translate(650 90)">
<g id="r"><rect width="200" height="50" rx="12" fill="#e0703a"/><text x="100" y="35" text-anchor="middle" font-size="26" fill="#fff">Work 20 s</text></g>
<g transform="translate(220 0)"><rect width="200" height="50" rx="12" fill="#fff"/><text x="100" y="35" text-anchor="middle" font-size="26" fill="#172018">Rest 10 s</text></g>
<g transform="translate(0 80)"><rect width="200" height="50" rx="12" fill="#e0703a"/><text x="100" y="35" text-anchor="middle" font-size="26" fill="#fff">Work 20 s</text></g>
<g transform="translate(220 80)"><rect width="200" height="50" rx="12" fill="#fff"/><text x="100" y="35" text-anchor="middle" font-size="26" fill="#172018">Rest 10 s</text></g>
<g transform="translate(0 160)"><rect width="200" height="50" rx="12" fill="#e0703a"/><text x="100" y="35" text-anchor="middle" font-size="26" fill="#fff">Work 20 s</text></g>
<g transform="translate(220 160)"><rect width="200" height="50" rx="12" fill="#fff"/><text x="100" y="35" text-anchor="middle" font-size="26" fill="#172018">Rest 10 s</text></g>
<text x="210" y="290" text-anchor="middle" font-size="64" fill="#172018">× 8 rounds</text>
<text x="210" y="350" text-anchor="middle" font-size="40" fill="#236a63">= 4 minutes</text>
</g></g>
</svg>
