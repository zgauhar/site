<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A use by label and a best before label with a days-left countdown">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f4ef"/><stop offset="1" stop-color="#a9d6c9"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1100" cy="560" r="200" fill="#fff" opacity=".35"/>
<g font-family="Space Grotesk,Arial,sans-serif" font-weight="700" text-anchor="middle">
<g transform="translate(70 110)"><rect width="320" height="410" rx="28" fill="#fff"/><rect x="30" y="34" width="260" height="70" rx="16" fill="#e0703a"/><text x="160" y="82" font-size="34" fill="#fff">USE BY</text><text x="160" y="190" font-size="30" fill="#172018">Chicken breast</text><text x="160" y="236" font-size="24" fill="#55604f" font-family="DM Sans,Arial,sans-serif" font-weight="500">Safety date</text><rect x="60" y="280" width="200" height="60" rx="30" fill="#fde3d4"/><text x="160" y="321" font-size="28" fill="#b04a1c">2 days left</text><text x="160" y="381" font-size="22" fill="#55604f" font-family="DM Sans,Arial,sans-serif" font-weight="500">Bin it after</text></g>
<g transform="translate(440 110)"><rect width="320" height="410" rx="28" fill="#fff"/><rect x="30" y="34" width="260" height="70" rx="16" fill="#236a63"/><text x="160" y="80" font-size="28" fill="#fff">BEST BEFORE</text><text x="160" y="190" font-size="30" fill="#172018">Pasta</text><text x="160" y="236" font-size="24" fill="#55604f" font-family="DM Sans,Arial,sans-serif" font-weight="500">Quality date</text><rect x="60" y="280" width="200" height="60" rx="30" fill="#dff0ec"/><text x="160" y="321" font-size="28" fill="#174a45">Check it</text><text x="160" y="381" font-size="22" fill="#55604f" font-family="DM Sans,Arial,sans-serif" font-weight="500">Often fine after</text></g>
<g transform="translate(830 110)"><rect width="300" height="410" rx="28" fill="#174a45"/><circle cx="150" cy="150" r="88" fill="none" stroke="#236a63" stroke-width="22"/><circle cx="150" cy="150" r="88" fill="none" stroke="#f2b33d" stroke-width="22" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="400" transform="rotate(-90 150 150)"/><text x="150" y="162" font-size="40" fill="#fff">12</text><text x="150" y="196" font-size="20" fill="#cfe3df" font-family="DM Sans,Arial,sans-serif" font-weight="500">days</text><text x="150" y="320" font-size="30" fill="#fff">Days left</text><text x="150" y="360" font-size="22" fill="#cfe3df" font-family="DM Sans,Arial,sans-serif" font-weight="500">Reminder set</text></g>
</g></svg>
