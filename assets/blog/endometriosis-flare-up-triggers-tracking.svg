<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A cycle calendar with three marked endometriosis flare-ups beside a flare log card">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d9d4"/><stop offset="1" stop-color="#eaa99f"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1080" cy="80" r="190" fill="#fff" opacity=".18"/><circle cx="90" cy="600" r="150" fill="#fff" opacity=".18"/>
<rect x="90" y="90" width="560" height="450" rx="30" fill="#fff"/>
<text x="130" y="150" font-family="Space Grotesk,Arial,sans-serif" font-weight="700" font-size="32" fill="#9b3d52">Cycle calendar</text>
<g fill="#f4ece9">
<rect x="130" y="180" width="62" height="62" rx="12"/><rect x="200" y="180" width="62" height="62" rx="12"/><rect x="270" y="180" width="62" height="62" rx="12"/><rect x="340" y="180" width="62" height="62" rx="12"/><rect x="410" y="180" width="62" height="62" rx="12"/><rect x="480" y="180" width="62" height="62" rx="12"/><rect x="550" y="180" width="62" height="62" rx="12"/>
