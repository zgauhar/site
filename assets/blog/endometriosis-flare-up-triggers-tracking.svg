<rect x="130" y="320" width="62" height="62" rx="12"/><rect x="200" y="320" width="62" height="62" rx="12"/><rect x="270" y="320" width="62" height="62" rx="12"/><rect x="340" y="320" width="62" height="62" rx="12"/><rect x="410" y="320" width="62" height="62" rx="12"/><rect x="480" y="320" width="62" height="62" rx="12"/><rect x="550" y="320" width="62" height="62" rx="12"/>
<rect x="130" y="390" width="62" height="62" rx="12"/><rect x="200" y="390" width="62" height="62" rx="12"/><rect x="270" y="390" width="62" height="62" rx="12"/><rect x="340" y="390" width="62" height="62" rx="12"/><rect x="410" y="390" width="62" height="62" rx="12"/><rect x="480" y="390" width="62" height="62" rx="12"/><rect x="550" y="390" width="62" height="62" rx="12"/></g>
<g fill="#f6d28b"><rect x="130" y="180" width="62" height="62" rx="12"/><rect x="200" y="180" width="62" height="62" rx="12"/><rect x="270" y="180" width="62" height="62" rx="12"/></g>
<g fill="#e9857d"><rect x="200" y="180" width="62" height="62" rx="12"/><rect x="270" y="180" width="62" height="62" rx="12"/><rect x="480" y="250" width="62" height="62" rx="12"/><rect x="550" y="250" width="62" height="62" rx="12"/><rect x="480" y="390" width="62" height="62" rx="12"/></g>
<g fill="#9b3d52"><circle cx="231" cy="211" r="9"/><circle cx="511" cy="281" r="9"/><circle cx="511" cy="421" r="9"/></g>
<text x="130" y="500" font-family="DM Sans,Arial,sans-serif" font-size="24" fill="#9b8a8c">Flares lined up against cycle days</text>
<rect x="690" y="150" width="420" height="330" rx="30" fill="#fff"/>
<text x="730" y="205" font-family="Space Grotesk,Arial,sans-serif" font-weight="700" font-size="30" fill="#9b3d52">Flare log</text>
