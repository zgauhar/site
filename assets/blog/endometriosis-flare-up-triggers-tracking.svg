<text x="730" y="260">Start</text><text x="1070" y="260" text-anchor="end" fill="#172018">Day 14, 08:00</text>
<text x="730" y="305">End</text><text x="1070" y="305" text-anchor="end" fill="#172018">Day 15, 20:00</text>
