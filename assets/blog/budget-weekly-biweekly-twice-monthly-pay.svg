<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Pay schedules compared: weekly 52, every two weeks 26, twice a month 24 paychecks a year">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f4ef"/><stop offset="1" stop-color="#a9d6c9"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1100" cy="70" r="190" fill="#fff" opacity=".3"/><circle cx="80" cy="590" r="150" fill="#fff" opacity=".3"/>
<g font-family="Space Grotesk,Arial,sans-serif" font-weight="700">
<rect x="80" y="90" width="1040" height="450" rx="30" fill="#fff"/>
<g font-size="32" fill="#172018"><text x="130" y="200">Weekly</text><text x="130" y="320">Every 2 weeks</text><text x="130" y="440">Twice a month</text></g>
<g fill="#236a63"><circle cx="470" cy="190" r="22"/><circle cx="590" cy="190" r="22"/><circle cx="710" cy="190" r="22"/><circle cx="830" cy="190" r="22"/></g>
<g fill="#f2b33d"><circle cx="590" cy="310" r="22"/><circle cx="830" cy="310" r="22"/><circle cx="470" cy="430" r="22"/><circle cx="830" cy="430" r="22"/></g>
<g fill="#d7e6e2"><rect x="470" y="302" width="0" height="0"/></g>
<g font-size="30" fill="#174a45" text-anchor="end" font-family="DM Sans,Arial,sans-serif" font-weight="700"><text x="1070" y="200">52 a year</text><text x="1070" y="320">26 a year</text><text x="1070" y="440">24 a year</text></g>
<rect x="130" y="490" width="940" height="4" rx="2" fill="#dff0ec"/>
<text x="130" y="525" font-size="22" fill="#55604f" font-family="DM Sans,Arial,sans-serif" font-weight="500">Budget per pay period, not per month</text>
</g></svg>
