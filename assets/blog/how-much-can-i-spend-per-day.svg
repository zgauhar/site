<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Income minus bills and savings divided by days left gives a daily budget of 28 euros">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f4ef"/><stop offset="1" stop-color="#a9d6c9"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1100" cy="70" r="190" fill="#fff" opacity=".3"/><circle cx="80" cy="590" r="150" fill="#fff" opacity=".3"/>
<g font-family="Space Grotesk,Arial,sans-serif" font-weight="700">
<g transform="translate(80 110)"><rect width="520" height="410" rx="30" fill="#fff"/>
<text x="40" y="70" font-size="30" fill="#55604f" font-family="DM Sans,Arial,sans-serif" font-weight="500">Income</text><text x="480" y="70" font-size="34" fill="#172018" text-anchor="end">2,400</text>
<text x="40" y="132" font-size="30" fill="#55604f" font-family="DM Sans,Arial,sans-serif" font-weight="500">Bills</text><text x="480" y="132" font-size="34" fill="#b04a1c" text-anchor="end">&#8722; 1,350</text>
<text x="40" y="194" font-size="30" fill="#55604f" font-family="DM Sans,Arial,sans-serif" font-weight="500">Savings</text><text x="480" y="194" font-size="34" fill="#b04a1c" text-anchor="end">&#8722; 200</text>
<rect x="40" y="224" width="440" height="4" rx="2" fill="#dff0ec"/>
<text x="40" y="288" font-size="30" fill="#55604f" font-family="DM Sans,Arial,sans-serif" font-weight="500">Left</text><text x="480" y="288" font-size="40" fill="#174a45" text-anchor="end">850</text>
<text x="40" y="360" font-size="30" fill="#55604f" font-family="DM Sans,Arial,sans-serif" font-weight="500">&#247; days to payday</text><text x="480" y="360" font-size="40" fill="#174a45" text-anchor="end">30</text></g>
<g transform="translate(680 150)"><rect width="440" height="340" rx="30" fill="#174a45"/>
<text x="220" y="80" font-size="28" fill="#cfe3df" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-weight="500">You can spend today</text>
<text x="220" y="196" font-size="104" fill="#fff" text-anchor="middle">28.33</text>
<rect x="60" y="240" width="320" height="22" rx="11" fill="#236a63"/><rect x="60" y="240" width="215" height="22" rx="11" fill="#f2b33d"/>
<text x="220" y="304" font-size="24" fill="#cfe3df" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-weight="500">Recalculated every morning</text></g>
</g></svg>
