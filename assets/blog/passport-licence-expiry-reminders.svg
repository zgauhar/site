<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A passport, an ID card and a driving licence with days-left countdowns">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f2ef"/><stop offset="1" stop-color="#a9d3cb"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1100" cy="560" r="200" fill="#fff" opacity=".35"/>
<g font-family="Space Grotesk,Arial,sans-serif" font-weight="700" text-anchor="middle">
<g transform="translate(70 100)"><rect width="300" height="430" rx="28" fill="#174a45"/><circle cx="150" cy="140" r="62" fill="none" stroke="#f2b33d" stroke-width="10"/><path d="M88 140h124M150 78v124" stroke="#f2b33d" stroke-width="6"/><text x="150" y="290" font-size="34" fill="#fff">Passport</text><rect x="40" y="320" width="220" height="64" rx="32" fill="#f2b33d"/><text x="150" y="364" font-size="30" fill="#172018">212 days</text></g>
