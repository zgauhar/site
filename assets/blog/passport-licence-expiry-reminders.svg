<g transform="translate(830 100)"><rect width="300" height="430" rx="28" fill="#fff"/><rect x="40" y="50" width="220" height="120" rx="14" fill="#fdf1d8"/><circle cx="90" cy="110" r="30" fill="#e0703a"/><text x="150" y="290" font-size="34" fill="#172018">Licence</text><rect x="40" y="320" width="220" height="64" rx="32" fill="#e0703a"/><text x="150" y="364" font-size="30" fill="#fff">9 days</text></g>
