<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="An incubator wrapped in a blanket during a power cut, with a temperature line that falls and recovers when the power returns">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f2ef"/><stop offset="1" stop-color="#a9d3cb"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1100" cy="560" r="200" fill="#fff" opacity=".35"/>
<g font-family="Space Grotesk,Arial,sans-serif" font-weight="700" text-anchor="middle">
<text x="600" y="96" font-size="44" fill="#174a45">Power cut? Keep the lid closed</text>
<g transform="translate(90 170)">
<rect x="0" y="40" width="420" height="300" rx="40" fill="#e0703a"/>
<path d="M0 120 h420 M0 200 h420 M0 280 h420" stroke="#c75f2e" stroke-width="10"/>
<rect x="60" y="0" width="300" height="90" rx="30" fill="#174a45"/>
<rect x="100" y="18" width="220" height="54" rx="14" fill="#cfe3df"/>
<g fill="#fdf1d8" stroke="#174a45" stroke-width="5"><ellipse cx="160" cy="45" rx="22" ry="28"/><ellipse cx="210" cy="45" rx="22" ry="28"/><ellipse cx="260" cy="45" rx="22" ry="28"/></g>
<text x="210" y="225" font-size="38" fill="#fff">Wrap it up</text>
</g>
<g transform="translate(600 180)">
<rect x="0" y="0" width="500" height="320" rx="28" fill="#fff" opacity=".9"/>
<path d="M40 80 H170 C230 80 230 220 290 220 H330 C380 220 390 90 450 80" fill="none" stroke="#236a63" stroke-width="12" stroke-linecap="round"/>
<path d="M40 80 H460" stroke="#a9d3cb" stroke-width="4" stroke-dasharray="12 12"/>
<rect x="190" y="250" width="160" height="44" rx="22" fill="#f2b33d"/><text x="270" y="282" font-size="24" fill="#172018">Power off</text>
<text x="458" y="64" font-size="26" fill="#236a63">37.5°</text>
<path d="M250 120 l-30 50 h26 l-14 44 l42 -60 h-26 l16 -34z" fill="#f2b33d" stroke="#174a45" stroke-width="4" stroke-linejoin="round"/>
</g>
</g></svg>
