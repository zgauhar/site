<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A dog pregnancy timeline from day 0 to 63 with markers for the relaxin test, ultrasound, palpation and X-ray">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f2ef"/><stop offset="1" stop-color="#a9d3cb"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1100" cy="560" r="200" fill="#fff" opacity=".35"/>
<g font-family="Space Grotesk,Arial,sans-serif" font-weight="700" text-anchor="middle">
<text x="600" y="96" font-size="44" fill="#174a45">Is she pregnant? Test at the right time</text>
<rect x="100" y="330" width="1000" height="24" rx="12" fill="#174a45"/>
<rect x="100" y="330" width="420" height="24" rx="12" fill="#236a63"/>
<circle cx="100" cy="342" r="26" fill="#174a45"/><text x="100" y="420" font-size="28" fill="#174a45">Day 0</text>
<circle cx="1100" cy="342" r="26" fill="#e0703a"/><text x="1100" y="420" font-size="28" fill="#174a45">Day 63</text>
<g><circle cx="497" cy="342" r="22" fill="#f2b33d" stroke="#174a45" stroke-width="6"/><rect x="380" y="180" width="234" height="100" rx="22" fill="#fff"/><text x="497" y="222" font-size="28" fill="#174a45">Ultrasound</text><text x="497" y="260" font-size="26" fill="#236a63">+ relaxin</text><path d="M497 280 V318" stroke="#174a45" stroke-width="6"/><text x="497" y="420" font-size="28" fill="#174a45">Day 25–30</text></g>
<g><circle cx="575" cy="342" r="16" fill="#fff" stroke="#174a45" stroke-width="6"/><rect x="520" y="450" width="170" height="64" rx="20" fill="#fff"/><text x="605" y="492" font-size="24" fill="#174a45">Palpation</text><path d="M575 362 V450" stroke="#174a45" stroke-width="5"/></g>
<g><circle cx="814" cy="342" r="22" fill="#e0703a" stroke="#174a45" stroke-width="6"/><rect x="720" y="180" width="190" height="100" rx="22" fill="#fff"/><text x="815" y="222" font-size="30" fill="#174a45">X-ray</text><text x="815" y="260" font-size="24" fill="#236a63">count pups</text><path d="M814 280 V318" stroke="#174a45" stroke-width="6"/><text x="814" y="420" font-size="28" fill="#174a45">Day 45+</text></g>
</g></svg>
